<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8faff">
<meta name="description" content="AgoraIn v4.0 全量重构进行中，服务暂停，感谢您的耐心等待。">
<meta name="robots" content="noindex, nofollow">
<title>服务暂停中 · AgoraIn v4.0 重构进行中</title>
<style>
  /* ==================== 全局基础 ==================== */
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    background: #eef2fb;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  [v-cloak] {
    display: none;
  }

  /* ==================== 页面容器 ==================== */
  .maintenance-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: linear-gradient(160deg, #f8faff 0%, #eef2fb 40%, #e8eef8 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ==================== Canvas 粒子背景 ==================== */
  .particle-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  /* ==================== 内容层 ==================== */
  .content-layer {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 48px 24px;
    max-width: 720px;
    width: 100%;
  }

  /* ==================== 品牌区 ==================== */
  .brand-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .logo-mark {
    width: 88px;
    height: 88px;
  }

  .logo-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .logo-ring {
    transform-origin: 60px 60px;
    animation: spinRing 8s linear infinite;
  }

  .logo-pulse {
    transform-origin: 60px 60px;
    animation: pulseRing 2.4s ease-in-out infinite;
  }

  .logo-text {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
  }

  @keyframes spinRing {
    to { transform: rotate(360deg); }
  }

  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.12); opacity: 0.25; }
  }

  .brand-name {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: 1px;
    margin: 0;
    user-select: none;
  }

  .brand-version {
    font-size: 13px;
    color: #4285f4;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin: 0;
  }

  /* ==================== 标题区 ==================== */
  .message-section {
    text-align: center;
  }

  .main-title {
    font-size: 36px;
    font-weight: 700;
    color: #1a1a2e;
    margin: 0 0 12px;
    display: flex;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    line-height: 1.3;
  }

  .title-char {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: charIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes charIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .subtitle {
    font-size: 15px;
    color: #5f6368;
    line-height: 1.7;
    margin: 0 auto;
    max-width: 480px;
  }

  /* ==================== 进度区 ==================== */
  .progress-section {
    width: 100%;
    max-width: 560px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(66, 133, 244, 0.1);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(66, 133, 244, 0.06);
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
    color: #3c4043;
    font-weight: 500;
  }

  .progress-percent {
    font-size: 20px;
    font-weight: 700;
    color: #4285f4;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum';
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: rgba(66, 133, 244, 0.1);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4285f4, #34a853);
    border-radius: 4px;
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ==================== 阶段列表 ==================== */
  .phase-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 20px;
  }

  .phase-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #9aa0a6;
    transition: color 0.3s;
  }

  .phase-item.done {
    color: #34a853;
  }

  .phase-item.active {
    color: #4285f4;
    font-weight: 600;
  }

  .phase-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #dadce0;
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .phase-item.done .phase-dot {
    background: #34a853;
  }

  .phase-item.active .phase-dot {
    background: #4285f4;
    box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.18);
    animation: dotPulse 1.6s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.18); }
    50% { box-shadow: 0 0 0 7px rgba(66, 133, 244, 0.08); }
  }

  /* ==================== 功能预告 ==================== */
  .features-section {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .feature-card {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(66, 133, 244, 0.1);
    border-radius: 100px;
    font-size: 13px;
    color: #3c4043;
    opacity: 0;
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: default;
    user-select: none;
  }

  .feature-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(66, 133, 244, 0.12);
  }

  @keyframes cardIn {
    to { opacity: 1; }
  }

  .feature-icon {
    font-size: 15px;
    line-height: 1;
  }

  .feature-text {
    white-space: nowrap;
  }

  /* ==================== 底部 ==================== */
  .footer-section {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .footer-text {
    font-size: 13px;
    color: #9aa0a6;
    margin: 0;
    line-height: 1.6;
  }

  .contact-links {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .contact-link {
    font-size: 13px;
    color: #4285f4;
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s;
    border-bottom: 1px solid transparent;
  }

  .contact-link:hover {
    opacity: 0.75;
    border-bottom-color: rgba(66, 133, 244, 0.4);
  }

  /* ==================== 无脚本提示 ==================== */
  .noscript-tip {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8faff;
    color: #5f6368;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    text-align: center;
    padding: 24px;
    z-index: 99;
  }

  /* ==================== 响应式 ==================== */
  @media (max-width: 600px) {
    .main-title {
      font-size: 26px;
    }

    .subtitle {
      font-size: 13.5px;
    }

    .phase-list {
      grid-template-columns: 1fr;
    }

    .content-layer {
      gap: 22px;
      padding: 32px 18px;
    }

    .progress-section {
      padding: 18px;
    }

    .logo-mark {
      width: 68px;
      height: 68px;
    }

    .brand-name {
      font-size: 22px;
    }

    .feature-card {
      padding: 7px 13px;
      font-size: 12.5px;
    }

    .progress-percent {
      font-size: 18px;
    }
  }

  /* ==================== 减少动效偏好 ==================== */
  @media (prefers-reduced-motion: reduce) {
    .logo-ring,
    .logo-pulse,
    .progress-fill::after,
    .phase-item.active .phase-dot {
      animation: none !important;
    }

    .title-char,
    .feature-card {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
    }

    .progress-fill {
      transition: none;
    }
  }
</style>
</head>
<body>

<div id="app" v-cloak>
  <div class="maintenance-page">
    <!-- Canvas 粒子背景 -->
    <canvas ref="canvasRef" class="particle-canvas"></canvas>

    <!-- 主内容区 -->
    <div class="content-layer">

      <!-- 品牌标识 -->
      <div class="brand-section">
        <div class="logo-mark">
          <svg viewBox="0 0 120 120" class="logo-svg" aria-hidden="true">
            <circle
              cx="60" cy="60" r="52"
              fill="none" stroke="#4285f4" stroke-width="2"
              stroke-dasharray="80 240"
              stroke-linecap="round"
              class="logo-ring"
            ></circle>
            <circle
              cx="60" cy="60" r="32"
              fill="none" stroke="#34a853" stroke-width="1.5" opacity="0.6"
              class="logo-pulse"
            ></circle>
            <text
              x="60" y="73" text-anchor="middle"
              font-size="38" font-weight="700" fill="#4285f4"
              class="logo-text"
            >A</text>
          </svg>
        </div>
        <h1 class="brand-name">AgoraIn</h1>
        <p class="brand-version">v4.0 重构进行中</p>
      </div>

      <!-- 标题 -->
      <div class="message-section">
        <h2 class="main-title">
          <span
            class="title-char"
            v-for="(char, i) in titleChars"
            :key="i"
            :style="{ animationDelay: (i * 0.06) + 's' }"
          >{{ char }}</span>
        </h2>
        <p class="subtitle">我们正在将「打卡工具」重塑为「班级教学管理一体机平台」</p>
      </div>

      <!-- 进度展示 -->
      <div class="progress-section">
        <div class="progress-header">
          <span>重构进度</span>
          <span class="progress-percent">{{ progressPercent }}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" :style="{ width: progressPercent + '%' }"></div>
        </div>
        <div class="phase-list">
          <div
            v-for="(phase, i) in phases"
            :key="phase.key"
            class="phase-item"
            :class="{ active: i === activePhaseIndex, done: i < activePhaseIndex }"
          >
            <span class="phase-dot"></span>
            <span class="phase-label">{{ phase.label }}</span>
          </div>
        </div>
      </div>

      <!-- 功能预告 -->
      <div class="features-section">
        <div
          class="feature-card"
          v-for="(feat, i) in features"
          :key="i"
          :style="{ animationDelay: (i * 0.1) + 's' }"
        >
          <span class="feature-icon">{{ feat.icon }}</span>
          <span class="feature-text">{{ feat.text }}</span>
        </div>
      </div>

      <!-- 底部信息 -->
      <div class="footer-section">
        <p class="footer-text">预计恢复时间：待定 · 感谢您的耐心等待</p>
        <div class="contact-links">
          <a href="https://doc.615mc.cn" class="contact-link" target="_blank" rel="noopener noreferrer">文档站首页</a>
        </div>
      </div>

    </div>
  </div>
</div>

<noscript>
  <div class="noscript-tip">
    AgoraIn v4.0 正在全量重构中，服务暂停。<br>
    请启用 JavaScript 以查看完整页面，或稍后再来访问。
  </div>
</noscript>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
(function () {
  'use strict';

  var createApp = Vue.createApp;
  var ref = Vue.ref;
  var computed = Vue.computed;
  var onMounted = Vue.onMounted;
  var onUnmounted = Vue.onUnmounted;

  createApp({
    setup: function () {
      /* ==================== 标题逐字动画 ==================== */
      var titleChars = computed(function () {
        return '服务暂停中'.split('');
      });

      /* ==================== 重构阶段数据 ==================== */
      var phases = [
        { key: 'p0', label: '脚手架搭建' },
        { key: 'p1', label: '领域与数据层' },
        { key: 'p2', label: '桌面端功能对齐' },
        { key: 'p3', label: '班级中心（座位/点名/积分/值日）' },
        { key: 'p4', label: '课表与 ClassIsland 联动' },
        { key: 'p5', label: '服务端重构与同步引擎' },
        { key: 'p6', label: 'Web 管理面板' },
        { key: 'p7', label: '答题卡与 AI 阅卷' },
        { key: 'p8', label: '家长端小程序' },
        { key: 'p9', label: '移动端与打包发布' }
      ];

      // 当前进行到的阶段索引（模拟值，接入真实数据后替换）
      var activePhaseIndex = ref(3);

      var progressPercent = computed(function () {
        return Math.round(((activePhaseIndex.value + 0.6) / phases.length) * 100);
      });

      /* ==================== 功能预告 ==================== */
      var features = [
        { icon: '🪑', text: '座位编排' },
        { icon: '🎯', text: '课堂点名' },
        { icon: '⭐', text: '积分系统' },
        { icon: '📅', text: 'CSES 课表' },
        { icon: '📝', text: '电子答题卡' },
        { icon: '🤖', text: 'AI 自动阅卷' },
        { icon: '👨‍👩‍👧', text: '家长端小程序' },
        { icon: '🧹', text: '值日管理' }
      ];

      /* ==================== Canvas 粒子系统 ==================== */
      var canvasRef = ref(null);
      var particles = [];
      var animationId = null;
      var resizeHandler = null;

      function createParticles(width, height, count) {
        var arr = [];
        for (var i = 0; i < count; i++) {
          arr.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            radius: Math.random() * 1.8 + 0.6,
            baseAlpha: Math.random() * 0.4 + 0.15
          });
        }
        return arr;
      }

      function drawParticles(ctx, width, height) {
        ctx.clearRect(0, 0, width, height);

        var connectionDist = 130;
        var connectionDistSq = connectionDist * connectionDist;
        var len = particles.length;

        // 绘制粒子间连线
        for (var i = 0; i < len; i++) {
          var pi = particles[i];
          for (var j = i + 1; j < len; j++) {
            var pj = particles[j];
            var dx = pi.x - pj.x;
            var dy = pi.y - pj.y;
            var distSq = dx * dx + dy * dy;
            if (distSq < connectionDistSq) {
              var dist = Math.sqrt(distSq);
              var alpha = (1 - dist / connectionDist) * 0.12;
              ctx.beginPath();
              ctx.moveTo(pi.x, pi.y);
              ctx.lineTo(pj.x, pj.y);
              ctx.strokeStyle = 'rgba(66, 133, 244, ' + alpha.toFixed(3) + ')';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        // 更新并绘制粒子
        for (var k = 0; k < len; k++) {
          var p = particles[k];

          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;
          if (p.y < -10) p.y = height + 10;
          if (p.y > height + 10) p.y = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(66, 133, 244, ' + p.baseAlpha.toFixed(3) + ')';
          ctx.fill();
        }
      }

      function initCanvas() {
        var canvas = canvasRef.value;
        if (!canvas) return;

        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        var dpr = window.devicePixelRatio || 1;

        function resize() {
          var w = window.innerWidth;
          var h = window.innerHeight;

          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          var count = Math.min(Math.floor((w * h) / 12000), 80);
          particles = createParticles(w, h, count);
        }

        resize();
        window.addEventListener('resize', resize);
        resizeHandler = resize;

        function frame() {
          drawParticles(ctx, window.innerWidth, window.innerHeight);
          animationId = window.requestAnimationFrame(frame);
        }
        frame();
      }

      onMounted(function () {
        // 尊重系统「减少动效」偏好：仅保留静态背景，不启动粒子动画
        var reduceMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) return;

        initCanvas();
      });

      onUnmounted(function () {
        if (animationId !== null) {
          window.cancelAnimationFrame(animationId);
          animationId = null;
        }
        if (resizeHandler) {
          window.removeEventListener('resize', resizeHandler);
          resizeHandler = null;
        }
        particles = [];
      });

      return {
        titleChars: titleChars,
        phases: phases,
        activePhaseIndex: activePhaseIndex,
        progressPercent: progressPercent,
        features: features,
        canvasRef: canvasRef
      };
    }
  }).mount('#app');
})();
</script>

</body>
</html>
